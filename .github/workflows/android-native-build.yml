name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - "android-kereta-malam-cafe/**"
      - ".github/workflows/android-native-build.yml"
      - "docs/ANDROID_CHANGE_TRACKER.md"
  pull_request:
    paths:
      - "android-kereta-malam-cafe/**"
      - ".github/workflows/android-native-build.yml"
      - "docs/ANDROID_CHANGE_TRACKER.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kereta-malam-cafe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Supabase credentials
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_PROJECT_ID" || { echo "Missing GitHub Actions secret: SUPABASE_PROJECT_ID"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "Missing GitHub Actions secret: SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "Missing GitHub Actions secret: SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          EXPECTED_PROJECT_ID="dbazoxwhhljpgtbnletc"
          EXPECTED_SUPABASE_URL="https://dbazoxwhhljpgtbnletc.supabase.co"
          NORMALIZED_SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | sed -E 's#^(https?://[^/]+)\.$#\1#')"
          if [ "$SUPABASE_PROJECT_ID" != "$EXPECTED_PROJECT_ID" ]; then
            echo "Wrong Supabase project secret; refusing to build APK."
            exit 1
          fi
          if [ "$NORMALIZED_SUPABASE_URL" != "$EXPECTED_SUPABASE_URL" ]; then
            echo "Wrong Supabase URL secret; refusing to build APK."
            exit 1
          fi
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*|*service_role*)
              echo "Refusing to embed a Supabase secret/service_role key in Android."
              exit 1
              ;;
          esac
          {
            printf 'SUPABASE_PROJECT_ID=%s\n' "$SUPABASE_PROJECT_ID"
            printf 'SUPABASE_URL=%s\n' "$NORMALIZED_SUPABASE_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
          } > local.properties

      - name: Configure safe placeholders for pull request builds
        if: github.event_name == 'pull_request'
        run: |
          {
            printf 'SUPABASE_PROJECT_ID=dbazoxwhhljpgtbnletc\n'
            printf 'SUPABASE_URL=https://dbazoxwhhljpgtbnletc.supabase.co\n'
            printf 'SUPABASE_PUBLISHABLE_KEY=\n'
          } > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kereta-malam-cafe-debug-apk
          path: android-kereta-malam-cafe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
