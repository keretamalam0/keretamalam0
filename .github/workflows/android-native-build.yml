name: Android Native Build

on:
  push:
    paths:
      - "android-kereta-malam-cafe/**"
      - ".github/workflows/android-native-build.yml"
      - "docs/ANDROID_CHANGE_TRACKER.md"
  pull_request:
    paths:
      - "android-kereta-malam-cafe/**"
      - ".github/workflows/android-native-build.yml"
      - "docs/ANDROID_CHANGE_TRACKER.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kereta-malam-cafe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kereta-malam-cafe-debug-apk
          path: android-kereta-malam-cafe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
