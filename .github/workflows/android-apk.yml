name: Build Kereta Malam Cafe APK

on:
  push:
    branches: [main]
    paths:
      - "android-kereta-malam-cafe/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kereta-malam-cafe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 35
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses

      - name: Configure Supabase credentials
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_PROJECT_ID" || { echo "Missing GitHub Actions secret: SUPABASE_PROJECT_ID"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "Missing GitHub Actions secret: SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "Missing GitHub Actions secret: SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          # This client was explicitly assigned to the Kereta Malam Cafe target project.
          EXPECTED_PROJECT_ID="dbazoxwhhljpgtbnletc"
          EXPECTED_SUPABASE_URL="https://dbazoxwhhljpgtbnletc.supabase.co"
          NORMALIZED_SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | sed -E 's#^(https?://[^/]+)\.$#\1#')"
          if [ "$SUPABASE_PROJECT_ID" != "$EXPECTED_PROJECT_ID" ]; then
            echo "Wrong Supabase project secret. Set SUPABASE_PROJECT_ID to the confirmed Kereta Malam Cafe project."
            exit 1
          fi
          if [ "$NORMALIZED_SUPABASE_URL" != "$EXPECTED_SUPABASE_URL" ]; then
            echo "Wrong SUPABASE_URL secret. It must match the confirmed project URL."
            exit 1
          fi
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*|*service_role*)
              echo "Refusing to embed a Supabase secret/service_role key in the Android app."
              exit 1
              ;;
          esac
          {
            printf 'SUPABASE_PROJECT_ID=%s\n' "$SUPABASE_PROJECT_ID"
            printf 'SUPABASE_URL=%s\n' "$NORMALIZED_SUPABASE_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
          } > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kereta-malam-cafe-debug-apk
          path: android-kereta-malam-cafe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
